name: Update timetables

# Every night just after midnight Pacific: fetch BC Transit's GTFS feed and today's ferry
# sailings, and commit any change. Pages then republishes the site; phones pick the new
# data up the next time the app opens with signal.
on:
  schedule:
    - cron: '23 8 * * *'   # 08:23 UTC = 00:23 PST / 01:23 PDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buses (BC Transit GTFS)
        run: python tools/build_bus.py
      - name: Ferries (open BC Ferries API)
        run: python tools/build_ferries.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update timetables $(date -u +%Y-%m-%d)"
          git push
